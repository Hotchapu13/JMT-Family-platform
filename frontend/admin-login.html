<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login · The JMT Legacy Archive</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="bg-surface">
    <div class="grain-overlay"></div>

    <main class="relative flex min-h-screen items-center justify-center px-6 py-16">
      <div
        class="pointer-events-none absolute inset-0 opacity-70"
        style="background: radial-gradient(ellipse at 50% 30%, #f5ebdc 0%, #fff8ef 55%, #fff8ef 100%)"
      ></div>

      <section class="relative w-full max-w-xl">
        <div class="mb-10 text-center">
          <span
            class="mx-auto mb-8 flex h-16 w-16 items-center justify-center rounded-full bg-primary font-display text-xl font-bold text-surface-lowest shadow-lift"
            >90</span
          >
          <p class="label-eyebrow">Editor-in-Chief</p>
          <h1 class="display-hero mt-4">Admin Sign In</h1>
          <p class="mx-auto mt-3 max-w-md prose-archive !text-base">
            Curator access for managing access codes, photographs and stories.
          </p>
        </div>

        <form data-admin-login-form class="card-exhibit" novalidate>
          <label for="admin-username" class="label-eyebrow !text-ink-faint block">Username</label>
          <input
            id="admin-username"
            name="username"
            type="text"
            autocomplete="username"
            required
            class="mt-3 w-full border-0 border-b border-outline bg-transparent px-0 py-3 font-display text-lg text-ink placeholder:text-ink-faint/60 focus:border-primary focus:outline-none focus:ring-0"
          />

          <label for="admin-password" class="label-eyebrow !text-ink-faint mt-6 block">Password</label>
          <div class="relative">
            <input
              id="admin-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="mt-3 w-full border-0 border-b border-outline bg-transparent px-0 py-3 pr-8 font-display text-lg text-ink placeholder:text-ink-faint/60 focus:border-primary focus:outline-none focus:ring-0"
            />
            <button
              type="button"
              data-toggle-password-visibility
              aria-label="Show password"
              class="absolute right-0 top-1/2 mt-1.5 -translate-y-1/2 text-ink-faint hover:text-primary"
            >
              <svg data-eye-open width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg data-eye-closed class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.5 5.4A10.7 10.7 0 0 1 12 5c7 0 11 7 11 7a13.6 13.6 0 0 1-3.1 3.8M6.1 6.6C3.4 8.5 1 12 1 12s4 7 11 7a10.6 10.6 0 0 0 4-.8" />
              </svg>
            </button>
          </div>

          <p
            data-admin-login-error
            role="alert"
            class="mt-4 hidden font-body text-sm text-primary"
          ></p>

          <button type="submit" data-admin-login-submit class="btn-primary mt-8 w-full">
            <span data-submit-label>Sign In</span>
          </button>
        </form>

        <p class="mt-6 text-center font-body text-sm text-ink-faint">
          Family viewer? <a href="/index.html" class="text-primary underline underline-offset-2">Sign in here</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/js/admin-login.js"></script>
  </body>
</html>
